# Local development stack. Start it with:  docker compose up -d
# The web app runs with `npm run dev` in frontend/, or in Docker with:
#   docker compose --profile web up -d
name: sentra

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://sentra:sentra@db:5432/sentra
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["http://localhost:3000"]'
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    COOKIE_SECURE: "false"   # local development runs on http://localhost
    # Encrypts target credentials (FR-2.2). This key is for local development only;
    # a CREDENTIALS_KEY in .env replaces it, and every real deployment sets its own.
    CREDENTIALS_KEY: "${CREDENTIALS_KEY:-kqmQKFLVD12H8tuxKcXU0ZIN4O2Y/EMTbbrptiL5Yew=}"
    # Sentra's own lab targets, which only the Target Connector may reach (FR-11.2)
    LAB_HOSTS: '["lab-rag-chatbot", "lab-support-agent", "lab-sql-agent", "lab-document-agent"]'
  volumes:
    - ./backend:/app
    # The object storage (app/core/storage.py), shared by the API and the workers: evidence
    # documents over 64 KB (FR-6.3)
    - objects:/data/objects
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

# Every lab target of the Security Lab (FR-11.1) runs the same way: behind the "lab" profile, on
# the isolated lab network only (FR-11.2), with fixed answers unless a local model is configured,
# and with the two credentials it shares with Sentra — the API key it is registered with and the
# administration token that reads /lab/state and resets it. The defaults are the ones
# backend/app/core/config.py starts with; a LAB_API_KEY and LAB_ADMIN_TOKEN in .env replace them
# on both sides at once.
x-lab-target: &lab-target
  profiles: ["lab"]
  networks: [lab]
  environment:
    LAB_MODEL: "${LAB_MODEL:-simulated}"
    LAB_API_KEY: "${LAB_API_KEY:-lab-api-key}"
    LAB_ADMIN_TOKEN: "${LAB_ADMIN_TOKEN:-lab-admin-token}"

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra
    ports:
      - "5433:5432"   # for database tools on your laptop: localhost:5433
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches every e-mail Sentra sends during development: http://localhost:8025
    image: axllent/mailpit:v1.31.2
    ports:
      - "8025:8025"

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    # Threads: the jobs mostly wait for targets and models, and each worker works on at least 10
    # campaign runs at once (NFR-1.2).
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=10
    networks: [default, lab]  # the Target Connector runs here, so the worker reaches the lab

  scheduler:
    <<: *backend
    # Sentra's own clock (FR-5.3): one process that places the tick jobs in the Task Queue, which
    # the workers then run. Its own schedule file stays outside the mounted code.
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat

  analysis-worker:
    <<: *backend
    # The LLM judge (FR-6.1) on its own queue, so its waits for a model never hold up the attempts
    # of campaign runs (NFR-1.4). It reaches only the LLM providers, never a target or the lab.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=10 --queues=analysis --hostname=analysis@%h

  # The four intentionally vulnerable lab targets of FR-11.1, each with its own synthetic data
  # and its own planted canary tokens. Start the Lab zone with:
  #   docker compose --profile lab up -d
  # Sentra never starts them itself (a container that can start containers can become root on the
  # host), so the Security Lab page asks for this command when the zone isn't running (UC-11.1,
  # 2a1), and "Deploy" does the rest.
  lab-rag-chatbot:
    <<: *lab-target
    # A RAG chatbot that answers from five synthetic documents.
    build: ./lab/targets/rag-chatbot

  lab-support-agent:
    <<: *lab-target
    # A customer-support agent with simulated tools: it looks up orders, refunds and escalates.
    build: ./lab/targets/support-agent

  lab-sql-agent:
    <<: *lab-target
    # An analytics assistant that answers by querying a synthetic SQLite database.
    build: ./lab/targets/sql-agent

  lab-document-agent:
    <<: *lab-target
    # A document desk that summarizes the documents it holds and the ones it is sent.
    build: ./lab/targets/document-agent

  prometheus:
    # Operational metrics (NFR-5.5, FR-10.6): it scrapes the API's /api/metrics. Start the
    # monitoring with:  docker compose --profile monitoring up -d
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    # The dashboards an alert of Screen 63 links to (UC-10.9 step 5). Set GRAFANA_URL to
    # http://localhost:3001 so the links appear.
    profiles: ["monitoring"]
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-sentra}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  shield:
    # A Sentra Shield gateway (FR-8.3) in front of the lab chatbot, to try UC-8.1 locally:
    #   1. On Screen 47, connect a gateway for that target and copy its credential once.
    #   2. Point the target's endpoint at the gateway: http://shield:8443/v1/chat/completions.
    #      The Target Connector only sends to a private address when the host is a lab host, so
    #      add "shield" to LAB_HOSTS in your .env for this (a gateway in front of a lab target
    #      is still the lab).
    #   3. SENTRA_GATEWAY_TOKEN=sgw_... docker compose --profile lab --profile shield up -d
    # No host port: the gateway is reached from the worker inside the stack, so the laptop keeps
    # no way into the isolated lab network (FR-11.2).
    profiles: ["shield"]
    build: ./shield
    environment:
      SENTRA_URL: http://api:8000
      SENTRA_GATEWAY_TOKEN: "${SENTRA_GATEWAY_TOKEN:-}"
      SHIELD_UPSTREAM_URL: http://lab-rag-chatbot:8080
      SHIELD_POSITION: in_front
      SHIELD_HEARTBEAT_SECONDS: "30"
    volumes:
      # The last policy it was given, so a restart during an outage still enforces it (UC-8.1)
      - shield-policy:/var/lib/sentra-shield
    networks: [default, lab]
    depends_on:
      - api

  web:
    profiles: ["web"]
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

networks:
  lab:
    # The isolated lab network (FR-11.2): no way out to the internet or to the laptop's network.
    internal: true

volumes:
  db-data:
  objects:
  shield-policy:
