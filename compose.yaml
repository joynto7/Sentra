# Local development stack. Start it with:  docker compose up -d
# The web app runs with `npm run dev` in frontend/, or in Docker with:
#   docker compose --profile web up -d
name: sentra

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://sentra:sentra@db:5432/sentra
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["http://localhost:3000"]'
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    COOKIE_SECURE: "false"   # local development runs on http://localhost
    # Encrypts target credentials (FR-2.2). This key is for local development only;
    # a CREDENTIALS_KEY in .env replaces it, and every real deployment sets its own.
    CREDENTIALS_KEY: "${CREDENTIALS_KEY:-kqmQKFLVD12H8tuxKcXU0ZIN4O2Y/EMTbbrptiL5Yew=}"
    # Sentra's own lab targets, which only the Target Connector may reach (FR-11.2)
    LAB_HOSTS: '["lab-rag-chatbot"]'
  volumes:
    - ./backend:/app
    # The object storage (app/core/storage.py), shared by the API and the workers: evidence
    # documents over 64 KB (FR-6.3)
    - objects:/data/objects
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra
    ports:
      - "5433:5432"   # for database tools on your laptop: localhost:5433
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches every e-mail Sentra sends during development: http://localhost:8025
    image: axllent/mailpit:v1.31.2
    ports:
      - "8025:8025"

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    # Threads: the jobs mostly wait for targets and models, and each worker works on at least 10
    # campaign runs at once (NFR-1.2).
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=10
    networks: [default, lab]  # the Target Connector runs here, so the worker reaches the lab

  scheduler:
    <<: *backend
    # Sentra's own clock (FR-5.3): one process that places the tick jobs in the Task Queue, which
    # the workers then run. Its own schedule file stays outside the mounted code.
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat

  analysis-worker:
    <<: *backend
    # The LLM judge (FR-6.1) on its own queue, so its waits for a model never hold up the attempts
    # of campaign runs (NFR-1.4). It reaches only the LLM providers, never a target or the lab.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=10 --queues=analysis --hostname=analysis@%h

  lab-rag-chatbot:
    # The first lab target (FR-11.1): an intentionally vulnerable RAG chatbot with synthetic data.
    # Start it with:  docker compose --profile lab up -d
    profiles: ["lab"]
    build: ./lab/targets/rag-chatbot
    environment:
      LAB_MODEL: simulated  # fixed answers; a local model through Ollama comes with FR-11.2
    networks: [lab]

  prometheus:
    # Operational metrics (NFR-5.5, FR-10.6): it scrapes the API's /api/metrics. Start the
    # monitoring with:  docker compose --profile monitoring up -d
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    # The dashboards an alert of Screen 63 links to (UC-10.9 step 5). Set GRAFANA_URL to
    # http://localhost:3001 so the links appear.
    profiles: ["monitoring"]
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-sentra}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  web:
    profiles: ["web"]
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

networks:
  lab:
    # The isolated lab network (FR-11.2): no way out to the internet or to the laptop's network.
    internal: true

volumes:
  db-data:
  objects:
