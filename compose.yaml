# Local development stack. Start it with:  docker compose up -d
# The web app runs with `npm run dev` in frontend/, or in Docker with:
#   docker compose --profile web up -d
name: sentra

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://sentra:sentra@db:5432/sentra
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["http://localhost:3000"]'
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    COOKIE_SECURE: "false"   # local development runs on http://localhost
    # Encrypts target credentials (FR-2.2). This key is for local development only;
    # a CREDENTIALS_KEY in .env replaces it, and every real deployment sets its own.
    CREDENTIALS_KEY: "${CREDENTIALS_KEY:-kqmQKFLVD12H8tuxKcXU0ZIN4O2Y/EMTbbrptiL5Yew=}"
    # Sentra's own lab targets, which only the Target Connector may reach (FR-11.2)
    LAB_HOSTS: '["lab-rag-chatbot"]'
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra
    ports:
      - "5433:5432"   # for database tools on your laptop: localhost:5433
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches every e-mail Sentra sends during development: http://localhost:8025
    image: axllent/mailpit:v1.31.2
    ports:
      - "8025:8025"

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    networks: [default, lab]  # the Target Connector runs here, so the worker reaches the lab

  lab-rag-chatbot:
    # The first lab target (FR-11.1): an intentionally vulnerable RAG chatbot with synthetic data.
    # Start it with:  docker compose --profile lab up -d
    profiles: ["lab"]
    build: ./lab/targets/rag-chatbot
    environment:
      LAB_MODEL: simulated  # fixed answers; a local model through Ollama comes with FR-11.2
    networks: [lab]

  web:
    profiles: ["web"]
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

networks:
  lab:
    # The isolated lab network (FR-11.2): no way out to the internet or to the laptop's network.
    internal: true

volumes:
  db-data:
